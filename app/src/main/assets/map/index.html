<!doctype html>
<!--
    La carte de Campus Explorer : une page web locale, affichee par la WebView de MapActivity.
    Elle est servie a l'adresse https://appassets.androidplatform.net/assets/map/index.html
    par le WebViewAssetLoader (voir MapActivity.setupWebView).
-->
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Carte du campus</title>
    <link rel="stylesheet" href="leaflet/leaflet.css">
    <link rel="stylesheet" href="map.css">
</head>
<body>
    <div id="map"></div>
    <script src="leaflet/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
